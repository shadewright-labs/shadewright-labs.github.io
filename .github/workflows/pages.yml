name: Pages

# Publishes the organisation site to GitHub Pages from main.
# Pages must be set to "GitHub Actions" as the source. Only the site files are published (see "Stage the site");
# paths such as /sablecourt/ come from other repositories' own Pages builds.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Copies an explicit allow-list (pages, robots.txt, .nojekyll, assets/, .well-known/) and fails on any other
      # file or dotfile, so package.json, the workflows and the README are never published.
      - name: Stage the site
        run: scripts/stage-site.sh _site

      - name: Check the pages
        run: python3 -I scripts/check-pages.py _site

      # Hidden files are left out by default; the staged folder holds only .nojekyll and .well-known.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
