<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 2574" width="360" height="2574" role="img" aria-labelledby="t d">
  <title id="t">How the Shadewright Labs products fit together</title>
  <desc id="d">The operator uses each product through one surface: a pull request review for Shadewright, sablectl and the web UI for Sablecourt, and the Nightloom view, which is not released. Shadewright's analyzer, executor, GitOps repository with Flux, and verifier form one chain; Sablecourt's control plane, Conclaves, managed workloads and three gates form another; Nightloom has one view and the decisions waiting. Two connections join the products. One: a one-way code-fault incident handoff from Shadewright to Sablecourt, approved by a person for each send; Sablecourt's intake is built and Shadewright's sender is planned. Two: a read-only observer feed from Sablecourt to Nightloom; Sablecourt's side is built and Nightloom's is not. Solid lines are built, dashed lines and tags are not built yet, and amber marks what a person decides.</desc>
  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#F0B86A"/></marker>
    <marker id="arrow-jade" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2DD4BF"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; fill: #EFE9DC; }
    .serif { font-family: "Iowan Old Style", Georgia, serif; font-size: 21px; }
    .caps { font-size: 14px; letter-spacing: 1.5px; }
    .t { font-size: 16px; font-weight: 600; }
    .d { fill: #BBB4C5; }
    .p { fill: #F0B86A; }
    .x { fill: #BBB4C5; font-style: italic; }
    .tag { font-size: 14px; letter-spacing: 1.2px; fill: #BBB4C5; }
    .tile { fill: #14111C; }
    .node { fill: #08060E; stroke-width: 1.5; }
    .ln { fill: none; stroke-width: 1.5; }
    .dash { stroke-dasharray: 6 5; }
  </style>
  <rect width="360" height="2574" fill="#0B0810"/>
  <clipPath id="c-op"><rect x="1" y="1" width="358" height="427" rx="14"/></clipPath>
  <rect class="tile" x="1" y="1" width="358" height="427" rx="14"/>
  <rect x="1" y="1" width="358" height="6" fill="#EFE9DC" clip-path="url(#c-op)"/>
  <rect x="1" y="1" width="358" height="427" rx="14" fill="none" stroke="#EFE9DC" stroke-width="1.5"/>
  <text class="serif" x="16" y="38">The operator</text>
  <text class="caps d" x="16" y="62">ONE PERSON, THREE SURFACES</text>
  <rect class="node" x="13" y="76" width="334" height="104" rx="10" stroke="#EFE9DC"/>
  <text class="caps" x="27" y="101" style="fill:#A879FF">SHADEWRIGHT</text>
  <text class="t" x="27" y="125">Pull request review</text>
  <text class="d" x="27" y="147">On the Git host, under branch rules</text>
  <text class="p" x="27" y="169">A person reviews and merges</text>
  <rect class="node" x="13" y="192" width="334" height="104" rx="10" stroke="#EFE9DC"/>
  <text class="caps" x="27" y="217" style="fill:#2DD4BF">SABLECOURT</text>
  <text class="t" x="27" y="241">sablectl and the web UI</text>
  <text class="d" x="27" y="263">Workloads, Conclaves, approvals</text>
  <text class="p" x="27" y="285">A person approves gated actions</text>
  <rect class="node" x="13" y="308" width="334" height="104" rx="10" stroke="#EFE9DC"/>
  <text class="caps" x="27" y="333" style="fill:#B794FF">NIGHTLOOM</text>
  <text class="t" x="27" y="357">Nightloom view</text>
  <text class="d" x="27" y="379">Sessions and waiting decisions</text>
  <text class="d" x="27" y="401">Not released</text>
  <clipPath id="c-shadewright"><rect x="1" y="456" width="358" height="630" rx="14"/></clipPath>
  <rect class="tile" x="1" y="456" width="358" height="630" rx="14"/>
  <rect x="1" y="456" width="358" height="7" fill="#A879FF" clip-path="url(#c-shadewright)"/>
  <rect x="1" y="456" width="358" height="630" rx="14" fill="none" stroke="#A879FF" stroke-width="1.5"/>
  <text class="serif" x="16" y="496">Shadewright</text>
  <text class="caps" x="16" y="520" style="fill:#A879FF">THE GUARDIAN · EARLY RELEASES</text>
  <rect class="node" x="13" y="540" width="334" height="114" rx="10" stroke="#A879FF"/>
  <text class="t" x="27" y="570">Analyzer</text>
  <text class="d" x="27" y="595">Groups symptoms into incidents</text>
  <text class="d" x="27" y="617">Reads the cluster, no Git credential</text>
  <text x="27" y="639" fill="#A879FF" style="fill:#A879FF">A model's answer is only a proposal</text>
  <path class="ln" d="M180 654V678" stroke="#A879FF"/>
  <rect class="node" x="13" y="678" width="334" height="114" rx="10" stroke="#A879FF"/>
  <text class="t" x="27" y="708">Executor</text>
  <text class="d" x="27" y="733">Checks each proposal against policy</text>
  <text class="d" x="27" y="755">Opens the pull request with the fix</text>
  <text x="27" y="777" fill="#A879FF" style="fill:#A879FF">Holds the Git App, reads no Secrets</text>
  <path class="ln" d="M180 792V816" stroke="#A879FF"/>
  <rect class="node" x="13" y="816" width="334" height="114" rx="10" stroke="#A879FF"/>
  <text class="t" x="27" y="846">GitOps repository and Flux</text>
  <text class="d" x="27" y="871">Your branch rules decide what merges</text>
  <text class="d" x="27" y="893">Flux applies the merged change</text>
  <text x="27" y="915" fill="#A879FF" style="fill:#A879FF">The only path to a workload</text>
  <path class="ln" d="M180 930V954" stroke="#A879FF"/>
  <rect class="node" x="13" y="954" width="334" height="114" rx="10" stroke="#A879FF"/>
  <text class="t" x="27" y="984">Verifier</text>
  <text class="d" x="27" y="1009">Samples the pods of the rollout</text>
  <text class="d" x="27" y="1031">Off by default for now</text>
  <text x="27" y="1053" fill="#A879FF" style="fill:#A879FF">No model, no Git App, no Secrets</text>
  <path class="ln dash" d="M30 1086V1140" stroke="#F0B86A"/>
  <path class="ln" d="M30 1164V1218" stroke="#F0B86A" marker-end="url(#arrow-amber)"/>
  <rect x="15" y="1140" width="30" height="24" rx="12" fill="#08060E" stroke="#F0B86A" stroke-width="1.5"/>
  <text class="t" x="30" y="1157" text-anchor="middle" style="font-size:15px">1</text>
  <text class="t" x="60" y="1116">Code-fault incident handoff</text>
  <text class="p" x="60" y="1139">One way; a person approves each send</text>
  <text x="60" y="1162">Sablecourt intake: built</text>
  <rect x="60" y="1172" width="85" height="21" rx="10.5" fill="none" stroke="#BBB4C5" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="tag" x="67" y="1187">PLANNED</text>
  <text class="x" x="153" y="1187">Shadewright sender</text>
  <clipPath id="c-sablecourt"><rect x="1" y="1218" width="358" height="630" rx="14"/></clipPath>
  <rect class="tile" x="1" y="1218" width="358" height="630" rx="14"/>
  <rect x="1" y="1218" width="358" height="7" fill="#2DD4BF" clip-path="url(#c-sablecourt)"/>
  <rect x="1" y="1218" width="358" height="630" rx="14" fill="none" stroke="#2DD4BF" stroke-width="1.5"/>
  <text class="serif" x="16" y="1258">Sablecourt</text>
  <text class="caps" x="16" y="1282" style="fill:#2DD4BF">THE COURT · NOT RELEASED YET</text>
  <rect class="node" x="13" y="1302" width="334" height="114" rx="10" stroke="#2DD4BF"/>
  <text class="t" x="27" y="1332">Control plane</text>
  <text class="d" x="27" y="1357">Runs what the manifests declare</text>
  <text class="d" x="27" y="1379">On a workstation or a cluster</text>
  <text x="27" y="1401" fill="#2DD4BF" style="fill:#2DD4BF">Audit chain, not anchored yet</text>
  <path class="ln" d="M180 1416V1440" stroke="#2DD4BF"/>
  <rect class="node" x="13" y="1440" width="334" height="114" rx="10" stroke="#2DD4BF"/>
  <text class="t" x="27" y="1470">Conclaves (agent councils)</text>
  <text class="d" x="27" y="1495">Rooms where agents work together</text>
  <text class="d" x="27" y="1517">and share redacted artifacts</text>
  <text x="27" y="1539" fill="#2DD4BF" style="fill:#2DD4BF">Message limits stop runaway loops</text>
  <path class="ln" d="M180 1554V1578" stroke="#2DD4BF"/>
  <rect class="node" x="13" y="1578" width="334" height="114" rx="10" stroke="#2DD4BF"/>
  <text class="t" x="27" y="1608">Managed workloads</text>
  <text class="d" x="27" y="1633">Rootless containers or OS sandbox</text>
  <text x="27" y="1655" fill="#2DD4BF" style="fill:#2DD4BF">No upstream API keys or Git tokens</text>
  <rect x="27" y="1662" width="85" height="21" rx="10.5" fill="none" stroke="#BBB4C5" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="tag" x="34" y="1677">PLANNED</text>
  <text class="x" x="120" y="1677">gVisor or Kata on Kubernetes</text>
  <path class="ln" d="M180 1692V1716" stroke="#2DD4BF"/>
  <rect class="node" x="13" y="1716" width="334" height="114" rx="10" stroke="#2DD4BF"/>
  <text class="t" x="27" y="1746">Three gates</text>
  <text class="d" x="27" y="1771">Model gate: cost per task and day</text>
  <text class="d" x="27" y="1793">Data and action gate: allowlists</text>
  <text class="p" x="27" y="1815">Approval queue: a person confirms</text>
  <path class="ln" d="M30 1848V1902" stroke="#2DD4BF"/>
  <path class="ln dash" d="M30 1926V1980" stroke="#2DD4BF" marker-end="url(#arrow-jade)"/>
  <rect x="15" y="1902" width="30" height="24" rx="12" fill="#08060E" stroke="#2DD4BF" stroke-width="1.5"/>
  <text class="t" x="30" y="1919" text-anchor="middle" style="font-size:15px">2</text>
  <text class="t" x="60" y="1878">Read-only observer feed</text>
  <text class="d" x="60" y="1901">Snapshot, live stream and task output</text>
  <text x="60" y="1924">Sablecourt side: built</text>
  <rect x="60" y="1934" width="100" height="21" rx="10.5" fill="none" stroke="#BBB4C5" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="tag" x="67" y="1949">NOT BUILT</text>
  <text class="x" x="168" y="1949">Nightloom side</text>
  <clipPath id="c-nightloom"><rect x="1" y="1980" width="358" height="424" rx="14"/></clipPath>
  <rect class="tile" x="1" y="1980" width="358" height="424" rx="14"/>
  <rect x="1" y="1980" width="358" height="7" fill="#8B3DFF" clip-path="url(#c-nightloom)"/>
  <rect x="1" y="1980" width="358" height="424" rx="14" fill="none" stroke="#8B3DFF" stroke-width="1.5"/>
  <text class="serif" x="16" y="2020">Nightloom</text>
  <text class="caps" x="16" y="2044" style="fill:#B794FF">THE WATCHER · NOT RELEASED</text>
  <rect class="node" x="13" y="2064" width="334" height="114" rx="10" stroke="#8B3DFF"/>
  <text class="t" x="27" y="2094">One view</text>
  <text class="d" x="27" y="2119">Coding sessions across terminals</text>
  <text class="d" x="27" y="2141">and machines</text>
  <text x="27" y="2163" fill="#B794FF" style="fill:#B794FF">See what's running</text>
  <path class="ln" d="M180 2178V2202" stroke="#8B3DFF"/>
  <rect class="node" x="13" y="2202" width="334" height="114" rx="10" stroke="#8B3DFF"/>
  <text class="t" x="27" y="2232">Decisions waiting</text>
  <text class="d" x="27" y="2257">Decisions waiting for the operator</text>
  <text class="d" x="27" y="2279">in the same view</text>
  <text class="p" x="27" y="2301">Know what needs you</text>
  <text class="d" x="180" y="2358" text-anchor="middle">Not released. No public code yet.</text>
  <path class="ln" d="M16 2443H50" stroke="#EFE9DC"/>
  <text class="d" x="60" y="2448">built</text>
  <path class="ln dash" d="M16 2477H50" stroke="#EFE9DC"/>
  <rect x="60" y="2467" width="85" height="21" rx="10.5" fill="none" stroke="#BBB4C5" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="tag" x="67" y="2482">PLANNED</text>
  <text class="d" x="153" y="2482">not built yet</text>
  <path class="ln" d="M16 2511H50" stroke="#F0B86A"/>
  <text class="d" x="60" y="2516">a person decides</text>
  <rect x="20" y="2533" width="26" height="22" rx="11" fill="#08060E" stroke="#EFE9DC" stroke-width="1.2"/>
  <text class="t" x="33" y="2549" text-anchor="middle" style="font-size:15px">1</text>
  <text class="d" x="60" y="2550">contract between products</text>
</svg>
