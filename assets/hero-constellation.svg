  <path class="edge-violet" d="M 184 312 L 242 376 L 292 342 M 242 376 L 206 464"/>
  <path class="edge-chord" d="M 92 344 L 242 376 L 108 442"/>

  <!-- G4: Inner-left lower constellation (below-left of the seal; visible at 1300px and 1920px) -->
  <path class="edge-ivory" d="M 342 462 L 394 438 L 446 482 L 376 506 Z"/>
  <path class="edge-chord" d="M 394 438 L 376 506"/>

  <!-- Upper sky sparse asterisms (cleanly above the orbit arc and wordmark, clear of nav) -->
  <path class="edge-sky" d="M 646 56 L 724 84 L 794 46 M 724 84 L 696 34"/>
  <path class="edge-sky" d="M 1062 54 L 1134 38 L 1192 82 L 1126 86 Z"/>

  <!-- G5: Inner-right upper constellation (below hero-nav, above wordmark; visible at 1300px and 1920px) -->
  <path class="edge-ivory" d="M 1334 114 L 1396 88 L 1518 96 L 1548 146 L 1422 150 Z"/>
  <path class="edge-violet" d="M 1396 88 L 1446 118 L 1518 96 M 1446 118 L 1548 146"/>
  <path class="edge-chord" d="M 1334 114 L 1446 118 L 1422 150"/>

  <!-- G6: Far-right upper constellation -->
  <path class="edge-ivory" d="M 1614 194 L 1686 118 L 1764 102 L 1842 166 L 1794 248 L 1658 268 Z"/>
  <path class="edge-violet" d="M 1686 118 L 1712 206 L 1764 102 M 1712 206 L 1794 248"/>
  <path class="edge-chord" d="M 1614 194 L 1712 206 L 1658 268 M 1712 206 L 1842 166"/>

  <!-- G7: Far-right lower constellation -->
  <path class="edge-ivory" d="M 1606 374 L 1692 330 L 1788 344 L 1834 418 L 1758 476 L 1644 456 Z"/>
  <path class="edge-violet" d="M 1692 330 L 1736 386 L 1788 344 M 1736 386 L 1758 476"/>
  <path class="edge-chord" d="M 1606 374 L 1736 386 L 1644 456 M 1736 386 L 1834 418"/>

  <!-- G8: Inner-right lower constellation (below tagline; visible at 1300px and 1920px) -->
  <path class="edge-ivory" d="M 1414 492 L 1476 472 L 1544 494 L 1488 514 Z"/>
  <path class="edge-chord" d="M 1476 472 L 1488 514"/>

  <!-- Soft halos behind violet accent stars -->
  <circle cx="178" cy="146" r="10" fill="url(#violet-soft)" class="pulse-1"/>
  <circle cx="242" cy="376" r="11" fill="url(#violet-soft)" class="pulse-2"/>
  <circle cx="794" cy="46" r="9" fill="url(#violet-soft)" class="pulse-3"/>
  <circle cx="1446" cy="118" r="10" fill="url(#violet-soft)" class="pulse-4"/>
  <circle cx="1736" cy="386" r="11" fill="url(#violet-soft)" class="pulse-5"/>
  <circle cx="1712" cy="206" r="9" fill="url(#violet-soft)"/>
  <circle cx="472" cy="92" r="7.5" fill="url(#violet-soft)"/>
  <circle cx="1134" cy="38" r="7" fill="url(#violet-soft)"/>
  <circle cx="1476" cy="472" r="7" fill="url(#violet-soft)"/>

  <!-- Subtle halos on key ivory stars -->
  <circle cx="138" cy="96" r="5.5" fill="url(#ivory-halo)"/>
  <circle cx="254" cy="114" r="5" fill="url(#ivory-halo)"/>
  <circle cx="418" cy="48" r="5" fill="url(#ivory-halo)"/>
  <circle cx="1686" cy="118" r="5.5" fill="url(#ivory-halo)"/>
  <circle cx="1794" cy="248" r="5" fill="url(#ivory-halo)"/>

  <!-- G1 dots -->
  <circle class="star-ivory" cx="74" cy="152" r="1.8"/>
  <circle class="star-ivory" cx="138" cy="96" r="2.1"/>
  <circle class="star-violet pulse-1" cx="178" cy="146" r="2.3"/>
  <circle class="star-ivory" cx="254" cy="114" r="1.9"/>
  <circle class="star-violet" cx="222" cy="206" r="1.9"/>
  <circle class="star-ivory-dim" cx="116" cy="224" r="1.7"/>

