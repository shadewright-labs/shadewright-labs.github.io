  <circle class="star-ivory-dim" cx="1334" cy="114" r="1.6"/>
  <circle class="star-ivory" cx="1396" cy="88" r="1.9"/>
  <circle class="star-violet pulse-4" cx="1446" cy="118" r="2.2"/>
  <circle class="star-ivory" cx="1518" cy="96" r="1.9"/>
  <circle class="star-ivory" cx="1548" cy="146" r="1.8"/>
  <circle class="star-ivory-dim" cx="1422" cy="150" r="1.5"/>

