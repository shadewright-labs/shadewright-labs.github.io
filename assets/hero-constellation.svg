  <!-- Single violet-brightening dot at (398, 122) -->
  <circle class="violet-halo" cx="398" cy="122" r="17"/>
  <circle class="violet-ring" cx="398" cy="122" r="8"/>
  <circle class="star-ivory" cx="398" cy="122" r="2.2"/>
  <circle class="violet-core" cx="398" cy="122" r="2.6"/>

