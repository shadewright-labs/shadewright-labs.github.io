  <circle class="star-violet" cx="394" cy="438" r="1.9"/>
  <circle class="star-ivory" cx="446" cy="482" r="1.8"/>
  <circle class="star-ivory-dim" cx="376" cy="506" r="1.5"/>

  <!-- Upper sky asterism dots -->
  <circle class="star-ivory-dim" cx="646" cy="56" r="1.6"/>
  <circle class="star-ivory" cx="724" cy="84" r="1.7"/>
  <circle class="star-violet pulse-3" cx="794" cy="46" r="2.1"/>
  <circle class="star-ivory-dim" cx="696" cy="34" r="1.4"/>
  <circle class="star-ivory-dim" cx="1062" cy="54" r="1.6"/>
  <circle class="star-violet" cx="1134" cy="38" r="1.9"/>
  <circle class="star-ivory" cx="1192" cy="82" r="1.7"/>
  <circle class="star-ivory-dim" cx="1126" cy="86" r="1.5"/>

