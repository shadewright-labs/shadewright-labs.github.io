<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 560" width="1920" height="560" aria-hidden="true">
  <defs>
    <radialGradient id="ivory-halo">
      <stop offset="0%" stop-color="#efe8d8" stop-opacity="0.48"/>
      <stop offset="45%" stop-color="#efe8d8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#efe8d8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-soft">
      <stop offset="0%" stop-color="#b794ff" stop-opacity="0.58"/>
      <stop offset="45%" stop-color="#8b3dff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#8b3dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-bloom">
      <stop offset="0%" stop-color="#b794ff" stop-opacity="0.88"/>
      <stop offset="32%" stop-color="#8b3dff" stop-opacity="0.44"/>
      <stop offset="70%" stop-color="#8b3dff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b3dff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .cluster-fill {
        fill: #8b3dff;
        fill-opacity: 0.036;
      }
      .edge-ivory {
        fill: none;
        stroke: #efe8d8;
        stroke-opacity: 0.17;
        stroke-width: 0.9;
        stroke-linecap: round;
      }
      .edge-violet {
        fill: none;
        stroke: #b794ff;
        stroke-opacity: 0.26;
        stroke-width: 0.95;
        stroke-linecap: round;
      }
      .edge-chord {
        fill: none;
        stroke: #8b3dff;
        stroke-opacity: 0.2;
        stroke-width: 0.7;
        stroke-linecap: round;
      }
      .edge-sky {
        fill: none;
        stroke: #efe8d8;
        stroke-opacity: 0.14;
        stroke-width: 0.75;
        stroke-linecap: round;
      }
      .bridge {
        fill: none;
        stroke: #b794ff;
        stroke-opacity: 0.15;
        stroke-width: 0.75;
        stroke-dasharray: 2 7;
        stroke-linecap: round;
      }
      .star-ivory {
        fill: #efe8d8;
        fill-opacity: 0.68;
      }
      .star-ivory-dim {
        fill: #efe8d8;
        fill-opacity: 0.44;
      }
      .star-violet {
        fill: #b794ff;
        fill-opacity: 0.8;
      }
      .star-field {
        fill: #efe8d8;
        fill-opacity: 0.38;
      }
      .star-field-violet {
        fill: #b794ff;
        fill-opacity: 0.44;
      }
      .pulse-1 {
        animation: labs-pulse 22s ease-in-out -4s infinite;
      }
      .pulse-2 {
        animation: labs-pulse 27s ease-in-out -11s infinite;
      }
      .pulse-3 {
        animation: labs-pulse 29s ease-in-out -17s infinite;
      }
      .pulse-4 {
        animation: labs-pulse 23s ease-in-out -7s infinite;
      }
      .pulse-5 {
        animation: labs-pulse 31s ease-in-out -19s infinite;
      }
      .violet-core {
        fill: #b794ff;
        animation: labs-violet-core 24s ease-in-out -11s infinite;
      }
      .violet-halo {
        fill: url(#violet-bloom);
        transform-box: fill-box;
        transform-origin: center;
        animation: labs-violet-halo 24s ease-in-out -11s infinite;
      }
      .violet-ring {
        fill: none;
        stroke: #b794ff;
        stroke-width: 0.9;
        transform-box: fill-box;
        transform-origin: center;
        animation: labs-violet-ring 24s ease-in-out -11s infinite;
      }
      @keyframes labs-pulse {
        0%, 100% { opacity: 0.42; }
        50% { opacity: 1; }
      }
      @keyframes labs-violet-core {
        0%, 100% { opacity: 0.08; }
        45%, 55% { opacity: 1; }
      }
      @keyframes labs-violet-halo {
        0%, 100% { opacity: 0.08; transform: scale(0.76); }
        45%, 55% { opacity: 0.95; transform: scale(1.12); }
      }
      @keyframes labs-violet-ring {
        0%, 100% { opacity: 0.06; transform: scale(0.84); }
        45%, 55% { opacity: 0.62; transform: scale(1.16); }
      }
      @media (prefers-reduced-motion: reduce) {
        .pulse-1,
        .pulse-2,
        .pulse-3,
        .pulse-4,
        .pulse-5,
        .violet-core,
        .violet-halo,
        .violet-ring {
          animation: none;
        }
        .violet-core { opacity: 0.72; }
        .violet-halo { opacity: 0.52; transform: none; }
        .violet-ring { opacity: 0.36; transform: none; }
      }
    </style>
  </defs>

  <!-- Subtle interior washes inside the outer constellation groups -->
  <polygon class="cluster-fill" points="74,152 138,96 254,114 222,206 116,224"/>
  <polygon class="cluster-fill" points="348,86 418,48 472,92 398,122 364,174"/>
  <polygon class="cluster-fill" points="92,344 184,312 292,342 242,376 206,464 108,442"/>
  <polygon class="cluster-fill" points="1334,114 1396,88 1518,96 1548,146 1422,150"/>
  <polygon class="cluster-fill" points="1614,194 1686,118 1764,102 1842,166 1794,248 1658,268"/>
  <polygon class="cluster-fill" points="1606,374 1692,330 1788,344 1834,418 1758,476 1644,456"/>

  <!-- Faint dashed bridges linking groups into one sky -->
  <path class="bridge" d="M 254 114 L 348 86 M 222 206 L 184 312 M 242 376 L 342 462"/>
  <path class="bridge" d="M 418 48 L 646 56 M 794 46 L 1062 54 M 1192 82 L 1334 114"/>
  <path class="bridge" d="M 1518 96 L 1686 118 M 1548 146 L 1614 194 M 1658 268 L 1692 330 M 1644 456 L 1544 494"/>

  <!-- G1: Far-left upper constellation -->
  <path class="edge-ivory" d="M 74 152 L 138 96 L 254 114 L 222 206 L 116 224 Z"/>
  <path class="edge-violet" d="M 138 96 L 178 146 L 254 114 M 178 146 L 222 206"/>
  <path class="edge-chord" d="M 74 152 L 178 146 L 116 224"/>

  <!-- G2: Inner-left upper constellation (above-left of the seal; visible at 1300px and 1920px) -->
  <path class="edge-ivory" d="M 348 86 L 418 48 L 472 92 M 348 86 L 364 174"/>
  <path class="edge-violet" d="M 348 86 L 398 122 L 472 92 M 398 122 L 364 174"/>
  <path class="edge-chord" d="M 418 48 L 398 122"/>

