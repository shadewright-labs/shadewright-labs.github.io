  <circle class="star-ivory" cx="1614" cy="194" r="1.8"/>
  <circle class="star-ivory" cx="1686" cy="118" r="2.1"/>
  <circle class="star-violet" cx="1764" cy="102" r="2.1"/>
  <circle class="star-ivory" cx="1842" cy="166" r="1.8"/>
  <circle class="star-ivory" cx="1794" cy="248" r="1.9"/>
  <circle class="star-violet" cx="1712" cy="206" r="2.2"/>
  <circle class="star-ivory-dim" cx="1658" cy="268" r="1.6"/>

  <!-- G7 dots -->
  <circle class="star-ivory-dim" cx="1606" cy="374" r="1.7"/>
  <circle class="star-ivory" cx="1692" cy="330" r="1.9"/>
  <circle class="star-ivory" cx="1788" cy="344" r="1.8"/>
  <circle class="star-ivory-dim" cx="1834" cy="418" r="1.6"/>
