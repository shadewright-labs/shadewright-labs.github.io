  <text class="t" x="37" y="935" text-anchor="middle" style="font-size:14px">1</text>
  <text class="t" x="67" y="936">Code-fault incident handoff, one way</text>
  <text class="p" x="67" y="961">A person approves each send</text>
  <text x="67" y="985">Sablecourt intake: built</text>
  <rect x="271" y="970" width="85" height="21" rx="10.5" fill="none" stroke="#BBB4C5" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="tag" x="278" y="985">PLANNED</text>
  <text class="x" x="364" y="985">Shadewright sender</text>
  <rect class="tile" x="617" y="900" width="602" height="104" rx="12" stroke="#3A3447" stroke-width="1.5"/>
  <rect x="638" y="918" width="30" height="24" rx="12" fill="#08060E" stroke="#2DD4BF" stroke-width="1.5"/>
  <text class="t" x="653" y="935" text-anchor="middle" style="font-size:14px">2</text>
  <text class="t" x="683" y="936">Read-only observer feed</text>
  <text class="d" x="683" y="961">Snapshot, live stream and task output</text>
  <text x="683" y="985">Sablecourt side: built</text>
  <rect x="887" y="970" width="100" height="21" rx="10.5" fill="none" stroke="#BBB4C5" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="tag" x="894" y="985">NOT BUILT</text>
  <text class="x" x="995" y="985">Nightloom side</text>
  <path class="ln" d="M1 1043H35" stroke="#EFE9DC"/>
  <text class="d" x="45" y="1048">built</text>
  <path class="ln dash" d="M141 1043H175" stroke="#EFE9DC"/>
  <rect x="185" y="1033" width="85" height="21" rx="10.5" fill="none" stroke="#BBB4C5" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text class="tag" x="192" y="1048">PLANNED</text>
  <text class="d" x="278" y="1048">not built yet</text>
  <path class="ln" d="M423 1043H457" stroke="#F0B86A"/>
  <text class="d" x="467" y="1048">a person decides</text>
  <rect x="639" y="1031" width="26" height="22" rx="11" fill="#08060E" stroke="#EFE9DC" stroke-width="1.2"/>
  <text class="t" x="652" y="1047" text-anchor="middle" style="font-size:14px">1</text>
  <text class="d" x="679" y="1048">contract between products</text>
